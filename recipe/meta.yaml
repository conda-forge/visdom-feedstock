{% set name = "visdom" %}
{% set version = "0.3.0" %}
{% set hash = "62e213f061b5f2c5d23c3292dcc4fc8414c24a88860651281ab1d7ce3ac9e260" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: {{ hash }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  noarch: python

requirements:
  build:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - jsonpatch
    - numpy
    - pillow
    - requests
    - scipy
    - six
    - tornado
    - websocket-client

test:
  imports:
    - visdom

about:
  home: https://github.com/fossasia/visdom
  license: CC-BY-NC-4.0
  license_file: {{ environ["RECIPE_DIR"] }}/LICENSE
  summary: A tool for visualizing live, rich data for Torch and Numpy.
  description: |
    A flexible tool for creating, organizing, and sharing visualizations
    of live, rich data. Supports Torch and Numpy.
  dev_url: https://github.com/fossasia/visdom

extra:
  recipe-maintainers:
    - andfoy
